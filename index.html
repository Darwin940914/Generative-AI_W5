<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬用分帳小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="py-8 px-4 flex justify-center items-start">

    <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <div class="bg-indigo-600 px-6 py-5 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold tracking-wide">🧾 萬用分帳小幫手</h1>
                    <p class="text-indigo-200 text-xs mt-1">支援公費與個人品項各自獨立計算服務費</p>
                </div>
                <button id="resetBtn" class="text-xs bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-1.5 rounded-lg transition shadow-sm">
                    全部重設
                </button>
            </div>
        </div>

        <div class="p-6 space-y-6">
            <!-- 第一區：共同平分項目 -->
            <section class="space-y-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-5 bg-indigo-600 rounded-full"></span>
                        <h2 class="text-sm font-semibold text-slate-700">1. 共同平分（如合點的菜、住宿）</h2>
                    </div>
                    <button id="addExpenseBtn" class="text-xs font-semibold text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">＋ 新增公費</button>
                </div>

                <div class="grid grid-cols-12 gap-2 text-[11px] font-medium text-slate-400 px-2">
                    <div class="col-span-4">項目名稱</div>
                    <div class="col-span-4">金額 ($)</div>
                    <div class="col-span-3">服務費 (%)</div>
                    <div class="col-span-1 text-center">刪</div>
                </div>

                <div id="expenseList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

                <div class="bg-slate-50 px-3.5 py-2.5 rounded-xl border border-slate-100 flex justify-between items-center text-xs text-slate-600">
                    <span>每人平攤公費：<strong id="sharedPerPersonDisplay" class="text-indigo-600">$0</strong> / 人</span>
                </div>
            </section>

            <!-- 第二區：成員與個人獨自品項 -->
            <section class="space-y-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-5 bg-indigo-600 rounded-full"></span>
                        <h2 class="text-sm font-semibold text-slate-700">2. 個人獨自點的品項 (<span id="memberCountBadge">2</span> 人)</h2>
                    </div>
                    <button id="addMemberBtn" class="text-xs font-semibold text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">＋ 新增成員</button>
                </div>

                <div class="grid grid-cols-12 gap-2 text-[11px] font-medium text-slate-400 px-2">
                    <div class="col-span-4">成員名稱</div>
                    <div class="col-span-4">個人餐點/花費 ($)</div>
                    <div class="col-span-3">服務費 (%)</div>
                    <div class="col-span-1 text-center">刪</div>
                </div>

                <div id="memberList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </section>

            <!-- 第三區：最終結算 -->
            <section class="bg-slate-900 text-white rounded-2xl p-5 space-y-4 shadow-inner">
                <div class="flex justify-between items-baseline border-b border-slate-700/80 pb-3">
                    <span class="text-xs text-slate-400 block">整筆帳單總計</span>
                    <span class="text-2xl font-extrabold text-amber-400" id="grandTotalDisplay">$0</span>
                </div>
                <div class="space-y-2">
                    <div class="text-xs font-medium text-slate-400 mb-1">每人應付明細（四捨五入）：</div>
                    <div id="resultList" class="space-y-2"></div>
                </div>
            </section>
        </div>
    </div>

    <script>
        let sharedExpenses = [
            { id: 1, title: '合點的炸物拼盤', amount: 300, feeRate: 10 },
            { id: 2, title: '車資(無服務費)', amount: 200, feeRate: 0 }
        ];
        let nextExpenseId = 3;

        let members = [
            { id: 1, name: '成員 A (吃牛排)', amount: 450, feeRate: 10 },
            { id: 2, name: '成員 B (吃義大利麵)', amount: 280, feeRate: 10 }
        ];
        let nextMemberId = 3;

        const expenseListEl = document.getElementById('expenseList');
        const memberListEl = document.getElementById('memberList');
        const sharedPerPersonDisplayEl = document.getElementById('sharedPerPersonDisplay');
        const grandTotalDisplay = document.getElementById('grandTotalDisplay');
        const resultListEl = document.getElementById('resultList');
        const memberCountBadge = document.getElementById('memberCountBadge');

        function renderExpenses() {
            expenseListEl.innerHTML = '';
            const isOnlyOne = sharedExpenses.length <= 1;
            sharedExpenses.forEach((exp) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-2 items-center p-1.5 rounded-xl border border-slate-100 bg-white';
                row.innerHTML = `
                    <div class="col-span-4"><input type="text" value="${exp.title}" data-id="${exp.id}" class="exp-title w-full px-2 py-2 text-sm bg-slate-50 border rounded-lg focus:ring-2"></div>
                    <div class="col-span-4"><input type="number" min="0" value="${exp.amount||''}" placeholder="0" data-id="${exp.id}" class="exp-amount w-full px-2 py-2 text-sm bg-slate-50 border rounded-lg focus:ring-2"></div>
                    <div class="col-span-3"><input type="number" min="0" max="100" value="${exp.feeRate}" data-id="${exp.id}" class="exp-fee w-full px-2 py-2 text-sm bg-slate-50 border rounded-lg focus:ring-2 text-right"></div>
                    <div class="col-span-1 flex justify-center"><button data-id="${exp.id}" ${isOnlyOne?'disabled':''} class="rm-exp w-7 h-7 text-xs font-bold ${isOnlyOne?'text-slate-300':'text-slate-400 hover:text-rose-600'}">✕</button></div>
                `;
                expenseListEl.appendChild(row);
            });
            bindEvents('.exp-title', '.exp-amount', '.exp-fee', '.rm-exp', sharedExpenses, renderExpenses);
        }

        function renderMembers() {
            memberListEl.innerHTML = '';
            memberCountBadge.textContent = members.length;
            const isOnlyOne = members.length <= 1;
            members.forEach((m) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-2 items-center p-1.5 rounded-xl border border-slate-100 bg-white';
                row.innerHTML = `
                    <div class="col-span-4"><input type="text" value="${m.name}" data-id="${m.id}" class="mem-title w-full px-2 py-2 text-sm bg-slate-50 border rounded-lg focus:ring-2"></div>
                    <div class="col-span-4"><input type="number" min="0" value="${m.amount||''}" placeholder="0" data-id="${m.id}" class="mem-amount w-full px-2 py-2 text-sm bg-slate-50 border rounded-lg focus:ring-2"></div>
                    <div class="col-span-3"><input type="number" min="0" max="100" value="${m.feeRate}" data-id="${m.id}" class="mem-fee w-full px-2 py-2 text-sm bg-slate-50 border rounded-lg focus:ring-2 text-right"></div>
                    <div class="col-span-1 flex justify-center"><button data-id="${m.id}" ${isOnlyOne?'disabled':''} class="rm-mem w-7 h-7 text-xs font-bold ${isOnlyOne?'text-slate-300':'text-slate-400 hover:text-rose-600'}">✕</button></div>
                `;
                memberListEl.appendChild(row);
            });
            bindEvents('.mem-title', '.mem-amount', '.mem-fee', '.rm-mem', members, renderMembers);
        }

        function bindEvents(titleCls, amtCls, feeCls, rmCls, dataArr, renderFn) {
            document.querySelectorAll(titleCls).forEach(el => el.addEventListener('input', e => {
                dataArr.find(i => i.id == e.target.dataset.id).title = e.target.value; // members use 'name', but mapped to title here for simplicity, wait, let's fix
                let item = dataArr.find(i => i.id == e.target.dataset.id);
                if(item.name !== undefined) item.name = e.target.value; else item.title = e.target.value;
                calculateResults();
            }));
            document.querySelectorAll(amtCls).forEach(el => el.addEventListener('input', e => {
                let v = parseFloat(e.target.value); dataArr.find(i => i.id == e.target.dataset.id).amount = (!isNaN(v)&&v>=0)?v:0; calculateResults();
            }));
            document.querySelectorAll(feeCls).forEach(el => el.addEventListener('input', e => {
                let v = parseFloat(e.target.value); dataArr.find(i => i.id == e.target.dataset.id).feeRate = (!isNaN(v)&&v>=0)?v:0; calculateResults();
            }));
            document.querySelectorAll(rmCls).forEach(el => el.addEventListener('click', e => {
                if(dataArr.length<=1) return;
                let idx = dataArr.findIndex(i => i.id == e.currentTarget.dataset.id);
                dataArr.splice(idx, 1);
                renderFn();
            }));
            calculateResults();
        }

        function calculateResults() {
            let totalShared = sharedExpenses.reduce((s, i) => s + (i.amount * (1 + i.feeRate/100)), 0);
            let sharedPerPerson = totalShared / (members.length || 1);
            sharedPerPersonDisplayEl.textContent = `$${Math.round(sharedPerPerson).toLocaleString()}`;

            let totalExtra = members.reduce((s, i) => s + (i.amount * (1 + i.feeRate/100)), 0);
            grandTotalDisplay.textContent = `$${Math.round(totalShared + totalExtra).toLocaleString()}`;

            resultListEl.innerHTML = '';
            members.forEach(m => {
                let personalTotal = m.amount * (1 + m.feeRate/100);
                let personPays = Math.round(sharedPerPerson + personalTotal);
                let detail = personalTotal > 0 ? `公費 $${Math.round(sharedPerPerson)} + 個人品項 $${Math.round(personalTotal)}` : `公費平分 $${Math.round(sharedPerPerson)}`;
                
                resultListEl.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-800/90 px-3.5 py-2.5 rounded-xl border border-slate-700/60">
                        <div><div class="font-semibold text-sm text-white">${m.name||'未命名'}</div><div class="text-[11px] text-slate-400">${detail}</div></div>
                        <div class="text-lg font-bold text-indigo-300">$${personPays.toLocaleString()}</div>
                    </div>`;
            });
        }

        document.getElementById('addExpenseBtn').addEventListener('click', () => { sharedExpenses.push({id: nextExpenseId++, title: `公費 ${sharedExpenses.length+1}`, amount: 0, feeRate: 0}); renderExpenses(); });
        document.getElementById('addMemberBtn').addEventListener('click', () => { members.push({id: nextMemberId++, name: `成員 ${String.fromCharCode(64+members.length+1)}`, amount: 0, feeRate: 0}); renderMembers(); });
        document.getElementById('resetBtn').addEventListener('click', () => {
            sharedExpenses = [{id:1, title:'', amount:0, feeRate:0}]; members = [{id:1, name:'成員 A', amount:0, feeRate:0}, {id:2, name:'成員 B', amount:0, feeRate:0}];
            renderExpenses(); renderMembers();
        });

        renderExpenses(); renderMembers();
    </script>
</body>
</html>
